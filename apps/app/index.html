<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Document Builder</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      // Apply the user's theme preference BEFORE React boots so we don't
      // flash the wrong colors. The same logic lives in ThemeProvider.tsx
      // for runtime changes; this inline block only handles the first paint.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark =
            stored === 'dark' || (stored !== 'light' && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
